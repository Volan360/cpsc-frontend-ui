<div class="app-container" *ngIf="isAuthenticated()">
  <mat-toolbar color="primary" class="global-toolbar">
    <button mat-icon-button class="hamburger-menu" (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    
    <button class="logo-btn" (click)="navigateTo('/dashboard')" matRipple matRippleColor="rgba(255,255,255,0.12)">
      <mat-icon class="logo-icon">account_balance_wallet</mat-icon>
      <span class="logo-word">FullStack</span><span class="logo-word logo-word-accent">Cash</span><span class="logo-word">Track</span>
    </button>
    
    <div class="desktop-nav">
      <button mat-button (click)="navigateTo('/institutions')">
        <mat-icon>account_balance</mat-icon>
        <span class="nav-label">Institutions</span>
      </button>
      
      <button mat-button (click)="navigateTo('/goals')">
        <mat-icon>flag</mat-icon>
        <span class="nav-label">Goals</span>
      </button>

      <button mat-button (click)="navigateTo('/analytics')">
        <mat-icon>insights</mat-icon>
        <span class="nav-label">Analytics</span>
      </button>
    </div>
    
    <span class="spacer"></span>
    
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-avatar-button">
      <div class="user-avatar">{{ getUserInitial() }}</div>
    </button>
    
    <mat-menu #userMenu="matMenu">
      <div class="user-info" mat-menu-item disabled>
        <div class="user-name">{{ currentUser()?.screenName || 'User' }}</div>
        <div class="user-email" *ngIf="currentUser()?.email">
          {{ currentUser()?.email }}
        </div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="navigateToProfile()">
        <mat-icon>settings</mat-icon>
        <span>Profile Settings</span>
      </button>
      <button mat-menu-item (click)="navigateTo('/help')">
        <mat-icon>help_outline</mat-icon>
        <span>Help</span>
      </button>
      <button mat-menu-item (click)="signOut()">
        <mat-icon>logout</mat-icon>
        <span>Sign Out</span>
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-drawer-container class="drawer-container">
    <mat-drawer #drawer mode="over" class="mobile-drawer">
      <div class="drawer-content">
        <button mat-button class="drawer-nav-item" (click)="navigateTo('/institutions'); drawer.close()">
          <mat-icon>account_balance</mat-icon>
          <span>Institutions</span>
        </button>
        
        <button mat-button class="drawer-nav-item" (click)="navigateTo('/goals'); drawer.close()">
          <mat-icon>flag</mat-icon>
          <span>Goals</span>
        </button>

        <button mat-button class="drawer-nav-item" (click)="navigateTo('/analytics'); drawer.close()">
          <mat-icon>insights</mat-icon>
          <span>Analytics</span>
        </button>
      </div>
    </mat-drawer>

    <mat-drawer-content>
      <div class="app-content">
        <router-outlet></router-outlet>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>

<router-outlet *ngIf="!isAuthenticated()"></router-outlet>
